<div class="box formula">Formulas: Circumference = 2πr &nbsp;•&nbsp; Area = πr<sup>2</sup></div>

<h3 class="qhead">Question 1</h3>
<p class="sol"><span class="pl">(i)</span> Circumference = 2 × <span class="frac"><span>22</span><span>7</span></span> × 7 = <b>44 cm</b></p>
<p class="sol"><span class="pl">(ii)</span> Area = <span class="frac"><span>22</span><span>7</span></span> × 7 × 7 = <b>154 cm<sup>2</sup></b></p>

<h3 class="qhead">Question 2</h3>
<p class="sol"><span class="pl">(i)</span> 2πr = 88 → r = 88 ÷ 2 ÷ <span class="frac"><span>22</span><span>7</span></span> = <b>14 cm</b></p>
<p class="sol"><span class="pl">(ii)</span> Diameter = 2 × 14 = <b>28 cm</b></p>
