<div class="box formula">සූත්‍ර: වෘත්තයේ පරිධිය = 2πr &nbsp;•&nbsp; වර්ගඵලය = πr<sup>2</sup></div>

<h3 class="qhead">ප්‍රශ්නය 1</h3>
<p class="sol"><span class="pl">(i)</span> පරිධිය = 2 × <span class="frac"><span>22</span><span>7</span></span> × 7 = <b>44 cm</b></p>
<p class="sol"><span class="pl">(ii)</span> වර්ගඵලය = <span class="frac"><span>22</span><span>7</span></span> × 7 × 7 = <b>154 cm<sup>2</sup></b></p>

<h3 class="qhead">ප්‍රශ්නය 2</h3>
<p class="sol"><span class="pl">(i)</span> 2πr = 88 → r = 88 ÷ 2 ÷ <span class="frac"><span>22</span><span>7</span></span> = <b>14 cm</b></p>
<p class="sol"><span class="pl">(ii)</span> විෂ්කම්භය = 2 × 14 = <b>28 cm</b></p>

<div class="box note"><b>මතක තබා ගන්න:</b> අරය ඍණ අගයක් විය නොහැක.</div>
